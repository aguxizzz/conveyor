spring.application.name=conveyor

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/conveyor}
spring.datasource.username=${DATABASE_USER:conveyor}
spring.datasource.password=${DATABASE_PASSWORD:conveyor}

management.endpoints.web.exposure.include=health,info,metrics

conveyor.worker.queues=default
conveyor.worker.concurrency=8
