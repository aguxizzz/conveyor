# Its own database: the server tracks conveyor's migrations in flyway_schema_history, which this app
# uses for its own, so the two can't share one. Create it with:
#   docker compose exec postgres createdb -U conveyor conveyor_example
spring.application.name=conveyor-example
server.port=8090

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/conveyor_example}
spring.datasource.username=${DATABASE_USER:conveyor}
spring.datasource.password=${DATABASE_PASSWORD:conveyor}

# Everything else is the starter's defaults: workers for the "default" queue, the cron scheduler and
# retention, all running inside this app.
