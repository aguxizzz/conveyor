# Defaults for running locally against the compose Postgres; every conveyor.* key is documented in
# ConveyorProperties, in the starter module.

spring.application.name=conveyor

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/conveyor}
spring.datasource.username=${DATABASE_USER:conveyor}
spring.datasource.password=${DATABASE_PASSWORD:conveyor}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}

conveyor.worker.queues=default
conveyor.worker.concurrency=8

# How often queue backlog gauges are re-read from the database.
conveyor.metrics.queue-refresh-interval=15s

# The server has no tables of its own, and its databases already track conveyor's migrations under
# Flyway's default history table from before the starter existed. Keeping that name lets them upgrade
# in place instead of re-running V1 on tables that are already there.
conveyor.schema.history-table=flyway_schema_history
