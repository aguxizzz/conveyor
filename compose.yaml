services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conveyor
      POSTGRES_USER: conveyor
      POSTGRES_PASSWORD: conveyor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conveyor"]
      interval: 2s
      retries: 15

  # Two app instances competing for the same queue, to see distributed claiming in action.
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/conveyor
    deploy:
      replicas: 2
    ports:
      - "8080-8081:8080"
